[repository]
name = "larsbx/tiling-theory-research"

[scan]
prose = ["README.md", "docs/**/*.md"]
source = ["src/**/*.py", "experiments/**/*.py", "scripts/**/*.py"]
exclude = ["vendor/**"]

[status]
classes = ["candidate", "open", "finite-domain", "conditional", "imported", "retired"]

[status.synonyms]
# Recognize the canonical status spellings in the registered surfaces.
"candidate" = "candidate"
"open" = "open"
"finite-domain" = "finite-domain"
"conditional" = "conditional"
"imported" = "imported"
"retired" = "retired"
"pending" = "open"
"experimental" = "candidate"
"verified finite computation" = "finite-domain"
"background" = "imported"

[claims]
paths = ["docs/**/*.md"]
statement_kinds = ["Definition", "Problem", "Conjecture", "Theorem", "Proposition", "Lemma", "Corollary"]
window_lines = 6
file_status_marker = "**Status:**"
file_status_lines = 5

[promotion]
proving_phrases = ["is proved", "we prove", "has been proved", "is a theorem", "establishes", "settles"]
negating_context = ["not ", "no ", "never", "until", "only after", "await", "pending", "would", "without", "if ", "does not"]
settled_classes = ["finite-domain"]
radius = 120

[[claim]]
name = "KATZ-AKN-C1"
status = "candidate"
[[claim.surfaces]]
path = "README.md"
anchor = "| KATZ-AKN-C1 |"
window_lines = 0
[[claim.surfaces]]
path = "docs/research/katz-akn-c1-local-completeness.md"
anchor = "**Claim ID:** KATZ-AKN-C1"
window_lines = 1
[[claim.surfaces]]
path = "research/candidates.json"
anchor = '"id": "KATZ-AKN-C1"'
window_lines = 1

[[claim.surfaces]]
path = "docs/roadmap.md"
anchor = "| KATZ-AKN-C1 |"
window_lines = 0

[[claim]]
name = "KATZ-AKN-PERFECT"
status = "open"
[[claim.surfaces]]
path = "docs/research/katz-akn-c1-local-completeness.md"
anchor = '`KATZ-AKN-PERFECT`'
window_lines = 0
[[claim.surfaces]]
path = "README.md"
anchor = "| KATZ-AKN-PERFECT |"
window_lines = 0
[[claim.surfaces]]
path = "docs/roadmap.md"
anchor = "| KATZ-AKN-PERFECT |"
window_lines = 0
[[claim.surfaces]]
path = "research/candidates.json"
anchor = '"id": "KATZ-AKN-PERFECT"'
window_lines = 1
