version = 2
template = "estate-repository-v2"

[repo]
id = "tiling-theory-research"
slug = "larsbx/tiling-theory-research"
class = "research"
layer = 3
band = "EXPLORE"
stage = "candidate"
inv = []
default_branch = "main"

[origin]
decided_by = "proposed"
# Origin: 2026-10-11 Katz/AKN matching-rules salvage thread (no durable chat URL recorded).
chats = []
artifacts = []

[[dep]]
id = "estate-governance"
rev = "5ea47dec8086eab6a1dad6fd239688d20ea89891"
pin = "sha256:412a64dea58d709aae21e5a0315b8e7e96488c310a9d999267927ba3d8146a30"

[exports]
names = []

[layout]
status = "transitional"

[principles]
ordering = ["authority", "domain", "language"]
empty_silos = "forbidden"
cross_language_disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"
no_unregistered_claims = true
no_perfection_claim_without_global_proof = true
finite_local_checks_are_not_global_perfection = true
experimental_code_is_non_authoritative = true
source_data_required_for_certification = true

[[plane]]
id = "policy"
target = "ESTATE.toml"
authority = "governance"
required = true
current = ["ESTATE.toml", "claim_governance.toml"]

[[plane]]
id = "research"
target = "docs/research"
authority = "claim_state"
required = true
current = ["docs/research"]

[[plane]]
id = "evidence"
target = "research"
authority = "evidence"
required = true
current = ["research/candidates.json"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["README.md", "docs/roadmap.md"]

[[plane]]
id = "kernel"
target = "kernel"
authority = "canonical_executable"
required = false

[[plane]]
id = "conformance"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

[[language]]
name = "Python"
authority = "canonical"
roles = ["kernel", "experiment"]
acceptance_authority = false

[migration]
mode = "boundary_first"
mass_move = false
next = [
  "Decide whether the exact certificate checkers in research/akn/ become the kernel plane or stay evidence.",
  "Estate policy: every repository with a kernel holds acceptance authority; this one switches `acceptance_authority` to true in the change that lands its first kernel.",
]

[[status_class]]
name = "candidate"
meaning = "Research direction captured, not yet established."

[[status_class]]
name = "open"
meaning = "Precise obligation or problem with no accepted proof or certificate."

[[status_class]]
name = "finite-domain"
meaning = "Finite claim backed by committed exhaustive enumeration/certificate."

[[status_class]]
name = "conditional"
meaning = "Claim valid only under stated hypotheses or pending external source data."

[[status_class]]
name = "imported"
meaning = "External result used as background, with source required in the dossier."

[[status_class]]
name = "retired"
meaning = "Claim abandoned, superseded, or falsified."
